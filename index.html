
<!DOCTYPE html>
<html>
<head>
    <title>Company Header</title>
    <style>
        * {
            margin: 10;
            padding: 10;
            box-sizing: border-box;
           font-family:'segoe UI',Tahoma,Geneva,Verdana,sans-serif;
        }

        body {
                 background:linear-gradient(135deg,#f5f7fa 0%,#e4e8ec 100%);
                 color:#333;
                 min-height:100vh;
           }

        .container {
            width: 90%;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
           background-color:EE7429;
        }

        .logo-section {
            display: flex;
            align-items: center;
        }

        .logo-section img {
            width: 50px;
            height: 50px;
            margin-right: 10px;
        }

        .company-name {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links a {
            text-decoration: none;
            margin-left: 20px;
            color: black;
            font-size: 16px;
        }

        .nav-links a:hover {
            color: sky blue;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
              <div class="logo-section">
                <img src="logo.jpeg" alt="logo">
                <div class="company-name">MY WEBSITE</div>
            </div>
            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">Login</a>
                <a href="#">Contact Us</a>
            </div>

        </div>
    </div>

</body>
</html>
